name: Build App

#se ejecuta en un pull request en la rama main
on:
  pull_request:
    branches: [main]

jobs:
  # divison de los jobs
  #este es el primero
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          
      - uses: actions/setup-java@v4        
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle                   
      - run: chmod +x gradlew
      - run: ./gradlew build -x test    

  # job de solo pruebas y corre si el anterio salio bien
  test:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:                            
        image: postgres:16
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:                                   
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew test

  # busca vulnerabilidades en el codigo java
  codeql:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write   # para subir los resultados a Security
    steps:
      - uses: actions/checkout@v4
      # preparo codeql para java
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none     # no compila, solo lee el codigo
      # corro el analisis
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  # escanea la imagen docker antes de subirla
  trivy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew
      # genero el jar que usa el dockerfile
      - run: ./gradlew bootJar -x test
      # construyo la imagen solo para escanearla
      - run: docker build -t app:scan .
      - name: Escanear imagen
        run: |
          # muestra las vulnerabilidades altas y criticas
          # exit-code 0 para que no falle el pipeline
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 0 app:scan

  # job de la img de docker
  docker:
    # espera a las pruebas, codeql y trivy
    needs: [test, codeql, trivy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew bootJar -x test     

      - name: Login en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Preparar nombre y tag
        run: |
          # nombre en minusculas
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          # tag con los primeros 7 del sha
          SHA=${{ github.event.pull_request.head.sha }}
          echo "SHA_SHORT=${SHA:0:7}" >> $GITHUB_ENV

      - name: Construir y publicar
        run: |
          # la imagen con dos tags
          docker build -t $IMAGE:latest -t $IMAGE:$SHA_SHORT .
          # subo todos los tags
          docker push --all-tags $IMAGE